[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-transfers"
version = "0.1.0"
description = "WebSocket relay broker and RPC client"
requires-python = ">=3.12"
dependencies = [
    "websockets>=16.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "obstore>=0.9",
    "asyncssh>=2.14",
]

[project.scripts]
nexus-transfers = "nexus_transfers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
