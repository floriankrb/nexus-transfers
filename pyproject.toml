[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-transfers"
version = "0.1.0"
description = "WebSocket relay server and RPC client"
requires-python = ">=3.12"
dependencies = [
    "websockets>=16.0",
    "tqdm>=4.60",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "obstore>=0.9",
    "asyncssh>=2.14",
]

[project.scripts]
nexus-server = "nexus_transfers.server:main"
nexus-client = "nexus_transfers.client:main"
nexus-copy = "nexus_transfers.copy:main"
nexus-monitor = "nexus_transfers.monitor:main"
nexus-copy-to-ssh = "nexus_transfers.copy_ssh:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
