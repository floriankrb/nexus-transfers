# ~/.nexus-transfer.toml — nexus-transfers configuration
#
# Precedence: CLI option > environment variable > this file > built-in default
#
# Top-level keys apply globally. Per-tool sections override for that tool.

# ─── Global settings ─────────────────────────────────────────────────────────

# WebSocket relay URL (env: NEXUS_TRANSFERS_URL)
url = "ws://localhost:8766"

# Authentication (env: NEXUS_TRANSFERS_USER, NEXUS_TRANSFERS_PASSWORD)
# user = "alice"
# password = "secret"

# ─── S3 staging ──────────────────────────────────────────────────────────────

# Bucket name, optionally with prefix (env: NEXUS_TRANSFER_S3_BUCKET)
# Accepted forms: "my-bucket", "s3://my-bucket", "s3://my-bucket/prefix/"
# s3_bucket = "my-bucket"

# S3-compatible endpoint URL (env: NEXUS_TRANSFER_S3_ENDPOINT_URL)
# s3_endpoint_url = "https://s3.example.com"

# Credentials (env: NEXUS_TRANSFER_S3_ACCESS_KEY_ID, NEXUS_TRANSFER_S3_SECRET_ACCESS_KEY)
# s3_access_key_id = "AKIA..."
# s3_secret_access_key = "wJal..."

# Use virtual-hosted-style requests (env: NEXUS_TRANSFER_S3_VIRTUAL_HOSTED_STYLE)
# s3_virtual_hosted_style = false

# ─── [server] — nexus-server ─────────────────────────────────────────────────

[server]
host = "localhost"
port = 8766
# debug = false

# ─── [client] — nexus-client ─────────────────────────────────────────────────

[client]
# server_url = "ws://localhost:8766"
reconnect_retries = -1       # -1 = infinite
reconnect_delay = 2.0        # seconds
peer_retries = -1            # -1 = infinite
peer_delay = 2.0             # seconds
# call_timeout = 60.0        # seconds; null = no timeout
# no_verify = false          # skip TLS verification
# interactive = false
# debug = false

# ─── [copy] — nexus-copy ─────────────────────────────────────────────────────

[copy]
# server_url = "ws://localhost:8766"
max_concurrent = 4           # parallel file transfers
chunk_size = 65536           # bytes per binary chunk
# use_server = false         # true = relay via WebSocket instead of S3
reconnect_retries = -1
reconnect_delay = 2.0
peer_retries = -1
peer_delay = 2.0
# call_timeout = null
# no_verify = false
# site = "my-site"           # label for auto-generated client name
# size = false               # show bytes instead of file count
# debug = false

# ─── [monitor] — nexus-monitor ───────────────────────────────────────────────

[monitor]
# server_url = "ws://localhost:8766"
reconnect_retries = -1
reconnect_delay = 2.0
# no_verify = false
# debug = false

# ─── [copy_ssh] — nexus-copy-to-ssh ──────────────────────────────────────────

[copy_ssh]
# server_url = "ws://localhost:8766"  # relay for monitoring only
max_concurrent = 4           # parallel SFTP uploads
ssh_port = 22
# ssh_key = "/home/user/.ssh/id_ed25519"
ssh_connections = 2          # SSH connection pool size
# site = "my-site"
# size = false
# no_verify = false
# debug = false
